name: Set up Node and install dependencies
description: >-
  Node 22 plus an installed node_modules tree, restored from cache when nothing
  that shaped it has changed.

  `actions/setup-node`'s `cache: npm` only caches the npm *download* cache, so
  `npm ci` still spends ~40s linking a tree that is byte-identical between runs.

  The key covers everything the tree is built against. `runner.os` alone is not
  enough: it reads "Linux" for both ubuntu-22.04 and ubuntu-24.04, so a tree
  carrying native modules (node-pty, sherpa-onnx) compiled on one image would be
  restored onto the other. Resolve the image version explicitly because hosted
  runner environment variables are not reliably exposed through the env context.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm

    - name: Resolve native dependency cache identity
      id: native-runtime
      shell: bash
      run: |
        node <<'JS'
        const fs = require("node:fs");
        const os = require("node:os");
        let image = os.release();
        if (process.platform === "linux") {
          const release = fs.readFileSync("/etc/os-release", "utf8");
          image = release.match(/^VERSION_ID="?([^"\n]+)/m)[1];
        }
        fs.appendFileSync(process.env.GITHUB_OUTPUT, `image=${process.platform}-${image}\n`);
        JS

    - name: Restore node_modules
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: >-
          node-modules-v3-${{ runner.os }}-${{ steps.native-runtime.outputs.image }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      # Only on a miss. A hit restored a tree built from this exact lockfile, on
      # this exact image and architecture, so its native builds are already
      # correct - rebuilding them here would cost back everything the cache saved.
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: node scripts/ci/npm-retry.mjs ci

    # Tag runs never write the cache. A GitHub Actions cache entry is scoped to
    # the ref that created it, with a read-only fallback to the default branch,
    # so an entry saved by a `refs/tags/vX.Y.Z` release run can never be read by
    # the next tag - it was pure cost. On Windows and macOS that save step was
    # 40-70s at the end of every desktop release job, on the run's critical path.
    # Branch and pull request runs still save, and
    # .github/workflows/cache-warm.yml populates, on main, the entries the
    # release runners restore.
    - name: Save node_modules
      if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Prepare selected branding
      shell: bash
      run: npm run brand:prepare
