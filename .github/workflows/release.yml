name: Release

# Builds and publishes a GitHub release for a `vX.Y.Z` tag: desktop bundles for
# Linux, Windows and macOS, the daemon bundles the install script downloads, the
# Electron updater manifests, the Android APK (release-
# signed when the keystore secrets are set, otherwise debug-signed and named
# `-unsigned`; see the android job) and the
# Docker image (when Docker Hub credentials are configured).
# website/src/content/docs/docs/contributing/release-process.mdx explains
# the flow, the asset names and the secrets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.1.5)"
        required: true
        type: string
      only:
        description: "Build one job group instead of the whole release"
        required: false
        default: all
        type: choice
        options: [all, android]
      platforms:
        description: "Which platforms to build"
        required: false
        default: default
        type: choice
        options: [default, all]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"
  # Windows code signing (Azure Trusted Signing); all optional, see scripts/release/sign-windows.ps1
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
  TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
  TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  # A tag whose suffix starts with a channel name (v1.6.0-beta.1, v1.8.0-rc.1.acme.2) builds the
  # beta channel's identity (frogg beta: its own app id, CLI, port and home), which installs
  # beside the stable build; a fork rebuild (v1.8.0-acme.2) is stable. brand:prepare reads this in
  # every job. Expressions have no regex, so this lists the common channel names; the meta job
  # checks it against scripts/release/release-channel.mjs and fails on a mismatch.
  FROGG_BRAND_CHANNEL: ${{ (contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-beta.') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-rc.') || contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-alpha.')) && 'beta' || 'stable' }}

jobs:
  meta:
    name: resolve version, create release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ env.RELEASE_TAG }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      clobber: ${{ steps.release.outputs.clobber }}
      docker: ${{ steps.secrets.outputs.docker }}
      android_signing: ${{ steps.secrets.outputs.android_signing }}
      desktop_matrix: ${{ steps.platforms.outputs.desktop }}
      daemon_matrix: ${{ steps.platforms.outputs.daemon }}
      build_all: ${{ steps.platforms.outputs.build_all }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}

      - uses: ./.github/actions/setup-node-deps

      - name: Resolve version from tag and package.json
        id: version
        run: |
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$version" != "$package_version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $package_version. Bump, sync, commit, then tag that commit."
            exit 1
          fi
          # A prerelease is a version whose suffix starts with a channel name (0.2.0-beta.1,
          # 1.8.0-rc.1.acme.2). A fork rebuild (1.8.0-acme.2) is a stable release: flagging it
          # would hide it from `self-update` on the stable channel, which requires
          # prerelease !== true. Same for a 0.x version, which is not a prerelease either.
          channel="$(node --input-type=module -e "import { channelOfVersion } from './scripts/release/release-channel.mjs'; process.stdout.write(channelOfVersion(process.argv[1]))" "$version")"
          if [ "$channel" != "$FROGG_BRAND_CHANNEL" ]; then
            echo "::error::$RELEASE_TAG is a $channel version but the workflow selected the $FROGG_BRAND_CHANNEL channel. Use -beta.N, -rc.N or -alpha.N for a channel part."
            exit 1
          fi
          prerelease=false
          [ "$channel" = "beta" ] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Betas ship from the development stream, stable releases from the stable stream
      # (frogg.json "streams"). Android-only reruns rebuild old tags, which may predate
      # the rule, so they skip it.
      - name: Require the tag on its stream's branch
        if: inputs.only != 'android'
        run: node scripts/release/streams.mjs assert-tag "$RELEASE_TAG"

      # Secrets are detected once here; jobs that need them read the flags. The
      # docker flags are optional, and so is android_signing: when
      # it is false the android job warns and publishes a debug-signed APK
      # named -unsigned (see that job's first step).
      - name: Detect optional secrets
        id: secrets
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          FROGG_ANDROID_KEYSTORE_BASE64: ${{ secrets.FROGG_ANDROID_KEYSTORE_BASE64 }}
          FROGG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FROGG_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          docker=false; android_signing=false
          [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ] && docker=true
          [ -n "$FROGG_ANDROID_KEYSTORE_BASE64" ] && [ -n "$FROGG_ANDROID_KEYSTORE_PASSWORD" ] && android_signing=true
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "android_signing=$android_signing" >> "$GITHUB_OUTPUT"
          echo "docker push: $docker, android release keystore: $android_signing"

      # Which platforms this run builds.
      #
      # A tag push is a real release and builds everything. A manual run defaults to the
      # small set actually used for day-to-day testing -- Windows x64 desktop, the
      # linux-x64 daemon bundle, and the arm64 Android APK -- because the full matrix is
      # four desktop runners and six daemon targets, and most runs only need those three.
      # Pick `platforms: all` on a manual run to get the whole matrix without a tag.
      #
      # The win-x64 daemon bundle rides along with the default set: the Windows desktop
      # app supervises a local daemon, so shipping it without that bundle is a broken
      # install rather than a smaller one.
      - name: Resolve platform matrix
        id: platforms
        env:
          PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: |
          if [ "$PLATFORMS" = "all" ]; then
            build_all=true
            desktop='{"include":[
              {"platform":"windows","arch":"x86_64","runner":"windows-latest","target":"win-x64"},
              {"platform":"linux","arch":"x86_64","runner":"ubuntu-22.04","target":"linux-x64"},
              {"platform":"macos","arch":"aarch64","runner":"macos-15","target":"darwin-arm64"},
              {"platform":"macos","arch":"x86_64","runner":"macos-15-intel","target":"darwin-x64"}
            ]}'
            daemon='{"include":[
              {"runner":"ubuntu-latest","target":"linux-x64"},
              {"runner":"ubuntu-latest","target":"linux-arm64"},
              {"runner":"macos-latest","target":"darwin-arm64"},
              {"runner":"macos-latest","target":"darwin-x64"},
              {"runner":"ubuntu-latest","target":"win-x64"},
              {"runner":"ubuntu-latest","target":"win-arm64"}
            ]}'
          else
            build_all=false
            desktop='{"include":[
              {"platform":"windows","arch":"x86_64","runner":"windows-latest","target":"win-x64"}
            ]}'
            daemon='{"include":[
              {"runner":"ubuntu-latest","target":"linux-x64"},
              {"runner":"ubuntu-latest","target":"win-x64"}
            ]}'
          fi
          {
            echo "build_all=$build_all"
            echo "desktop=$(echo "$desktop" | tr -d '\n ')"
            echo "daemon=$(echo "$daemon" | tr -d '\n ')"
          } >> "$GITHUB_OUTPUT"
          echo "platforms=$PLATFORMS (all=$build_all)"

      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## "v"($| )" {p=1; next} /^## / {p=0} p' CHANGELOG.md \
            | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md entry for $VERSION. See CHANGELOG.md in the repository." > notes.md
          fi
          # The run id marker lets a re-run of this workflow run overwrite its own
          # assets (--clobber) while a fresh run against an existing release cannot.
          printf '\n\n<!-- frogg-release-run-id: %s -->\n' "$GITHUB_RUN_ID" >> notes.md
          cat notes.md

      - name: Create GitHub release if missing
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --json body --jq .body > existing-body.txt 2>/dev/null; then
            if grep -q "frogg-release-run-id: $GITHUB_RUN_ID" existing-body.txt; then
              echo "Release $RELEASE_TAG was created by this run; re-uploads may overwrite."
              echo "clobber=true" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Release $RELEASE_TAG already exists from another run; existing assets will not be overwritten."
              echo "clobber=false" >> "$GITHUB_OUTPUT"
            fi
          else
            product_name=$(node -p 'require("./.generated/branding/brand.json").name')
            args=(--title "$product_name $VERSION" --notes-file notes.md --verify-tag --draft)
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
            echo "clobber=true" >> "$GITHUB_OUTPUT"
          fi

      # https://frogg.app/install.sh redirects to the latest release's copy of
      # these, so every published release must carry them: the script and the
      # assets it downloads then always come from the same release.
      - name: Upload install scripts to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOBBER: ${{ steps.release.outputs.clobber }}
        run: |
          flags=()
          if [ "$CLOBBER" = "true" ]; then flags+=(--clobber); fi
          # Skip names already on the release like every other upload step does.
          # Without this, re-running the workflow against a published release
          # fails here and takes every job that needs `meta` down with it.
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for f in .generated/branding/scripts/install.sh .generated/branding/scripts/uninstall.sh .generated/branding/scripts/install-docker.sh .generated/branding/scripts/uninstall-docker.sh; do
            n=$(basename "$f")
            if [ "$CLOBBER" != "true" ] && grep -qx -- "$n" <<<"$existing"; then
              echo "::warning::$n already on $RELEASE_TAG; skipping"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" "${flags[@]}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

  ui:
    name: web ui export
    needs: meta
    if: inputs.only != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci

      - name: Export web UI
        run: npm run build:ui

      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: apps/ui/dist
          # Expo exports brand assets under assets/.generated/; upload-artifact
          # drops dot-directories by default, which strips the logo from every
          # desktop and daemon build that consumes this artifact.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.platform }} ${{ matrix.arch }}
    # `needs: ui` earns its wait: this job downloads ui-dist and passes
    # --skip-export, so the Expo web export runs once for the whole release
    # instead of once per desktop runner. electron-builder still packs
    # ../ui/dist as extraResources, it just no longer builds it four times.
    needs: [meta, ui]
    if: inputs.only != 'android'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Built in the meta job so a manual run can trim the matrix; see the comment there.
      # ubuntu-22.04 is deliberate for linux: deb/AppImage link against the build host's
      # glibc and webkit2gtk, so older is more portable.
      matrix: ${{ fromJSON(needs.meta.outputs.desktop_matrix) }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}
      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: apps/ui/dist

      # The Electron binary zip (~100 MB) is fetched by @electron/get into the
      # per-OS cache below and then reused by electron-builder when it packs.
      # Restore only on tags: a cache entry saved from `refs/tags/vX.Y.Z` is
      # scoped to that ref and is unreadable by the next tag, so the save would
      # be pure cost (see .github/actions/setup-node-deps for the same lesson).
      # .github/workflows/cache-warm.yml writes the entry on main; the read-only
      # fallback to the default branch is what makes this hit on a release.
      - name: Restore Electron download cache
        id: electron-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~\AppData\Local\electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - run: npm run install:electron --workspace=@frogg/desktop

      - name: Save Electron download cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') && steps.electron-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~\AppData\Local\electron
          key: ${{ steps.electron-cache.outputs.cache-primary-key }}

      - name: Build app-only Electron bundles
        run: npm run build:desktop -- --target ${{ matrix.target }} --skip-export
      - name: Collect release assets
        run: |
          mkdir -p release-assets
          find apps/desktop/release -maxdepth 1 -type f             \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.blockmap' \)             -exec cp {} release-assets/ \;
      - name: Smoke packaged Linux startup and relaunch
        if: matrix.platform == 'linux'
        env:
          FROGG_ELECTRON_SMOKE_NO_SANDBOX: "1"
        run: |
          binary=$(node -p 'require("./.generated/branding/brand.json").id')
          FROGG_ELECTRON_SMOKE_EXECUTABLE="$PWD/apps/desktop/release/linux-unpacked/$binary" \
            xvfb-run -a npm run test:smoke --workspace=@frogg/desktop
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOBBER: ${{ needs.meta.outputs.clobber }}
        run: |
          flags=()
          if [ "$CLOBBER" = "true" ]; then flags+=(--clobber); fi
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for f in release-assets/*; do
            n=$(basename "$f")
            if [ "$CLOBBER" != "true" ] && grep -qx -- "$n" <<<"$existing"; then
              echo "::warning::$n already on $RELEASE_TAG; skipping"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" "${flags[@]}"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets
          retention-days: 7

  daemon-build:
    name: shared daemon build
    needs: [meta, ui]
    if: inputs.only != 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}

      - uses: ./.github/actions/setup-node-deps

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: apps/ui/dist

      - name: Build daemon with the shared web UI
        run: npm run build:server && npm run build:daemon-web-ui -- --skip-export

      # Compiled JS and web assets are platform-independent. Target-specific
      # native packages are still installed by each bundle job.
      - uses: actions/upload-artifact@v7
        with:
          name: daemon-dist
          path: |
            apps/cli/dist
            packages/branding/dist
            packages/protocol/dist
            packages/client/dist
            packages/relay/dist
            packages/highlight/dist
            packages/server/dist
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  daemon-bundle:
    name: daemon bundle ${{ matrix.target }}
    # Package as soon as the shared build is ready; Android and desktop do not
    # gate daemon availability or failures.
    needs: [meta, daemon-build]
    if: inputs.only != 'android'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Built in the meta job so a manual run can trim the matrix; see the comment there.
      # Every target cross-builds from Linux (the script only downloads binaries); macOS
      # runners are kept for the darwin targets so the tarballs are packed with BSD tar
      # like the install script expects.
      matrix: ${{ fromJSON(needs.meta.outputs.daemon_matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}

      # The bundle script lands with the install-script work; until it is on the
      # tagged commit this job is a no-op rather than a failure.
      - name: Check for bundle script
        id: script
        run: |
          if [ -f scripts/release/build-daemon-bundle.mjs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::scripts/release/build-daemon-bundle.mjs is not on $RELEASE_TAG; skipping daemon bundle."
          fi

      - uses: actions/setup-node@v7
        if: steps.script.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.script.outputs.present == 'true'
        run: node scripts/ci/npm-retry.mjs ci

      - uses: actions/download-artifact@v8
        if: steps.script.outputs.present == 'true'
        with:
          name: daemon-dist
          path: .

      - name: Build daemon bundle
        if: steps.script.outputs.present == 'true'
        run: npm run build:daemon-bundle -- --target ${{ matrix.target }} --out-dir dist/bundles

      - name: Upload to GitHub release
        if: steps.script.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CLOBBER: ${{ needs.meta.outputs.clobber }}
        run: |
          flags=()
          if [ "$CLOBBER" = "true" ]; then flags+=(--clobber); fi
          # Linux/macOS targets produce .tar.gz, Windows targets .zip; each
          # comes with its .sha256 sidecar and nothing else matches the glob.
          find dist/bundles -maxdepth 1 -type f -print
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          while IFS= read -r -d '' f; do
            n=$(basename "$f")
            if [ "$CLOBBER" != "true" ] && grep -qx -- "$n" <<<"$existing"; then
              echo "::warning::$n already on $RELEASE_TAG; skipping"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" "${flags[@]}"
          done < <(find dist/bundles -maxdepth 1 -type f -print0)

  android:
    name: android apk ${{ matrix.abi }}
    needs: meta
    # The repo variable FROGG_ANDROID_RUNNER=self-hosted moves this onto a
    # self-hosted Windows runner labelled android-win (warm builds there take
    # about half as long as ubuntu-latest). Unset it to fall back to hosted.
    runs-on: ${{ fromJSON(vars.FROGG_ANDROID_RUNNER == 'self-hosted' && '["self-hosted","windows","android-win"]' || '"ubuntu-latest"') }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a]
    steps:
      # No release keystore is configured yet, and every APK published so far
      # (0.1.18 and earlier) is debug-signed. Android identifies an app by its
      # signing key, so switching to a release key now would stop those installs
      # updating: they would have to be uninstalled first, losing their data.
      # Until that migration is planned (release-process.mdx, "Android signing"), a missing
      # keystore is a warning and the APK ships `-unsigned`, matching what is
      # already installed. It must not be treated as a distributable build.
      - name: Warn when the release keystore is missing
        if: needs.meta.outputs.android_signing != 'true'
        run: |
          echo "::warning::No Android release keystore for $RELEASE_TAG; the APK is signed with the publicly known Expo/React Native debug key and is published as -unsigned. Set FROGG_ANDROID_KEYSTORE_BASE64, FROGG_ANDROID_KEYSTORE_PASSWORD, FROGG_ANDROID_KEY_ALIAS and FROGG_ANDROID_KEY_PASSWORD to sign it, and see https://frogg.app/docs/contributing/release-process/ before doing so: existing debug-signed installs cannot update to a release-signed APK."

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}
      - name: Free disk space (Android SDK + NDK + node_modules need it)
        if: vars.FROGG_ANDROID_RUNNER != 'self-hosted'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Trim the Android SDK to what the build needs
        if: vars.FROGG_ANDROID_RUNNER != 'self-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images || true
          df -h /

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the Android SDK; this accepts the licenses so Gradle can
      # fetch any platform/build-tools/NDK version React Native asks for. A
      # self-hosted runner has its SDK preinstalled at ANDROID_HOME (runner .env).
      - uses: android-actions/setup-android@v4
        if: vars.FROGG_ANDROID_RUNNER != 'self-hosted'
        with:
          # sdkmanager no longer provides the obsolete tools package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # Restores the Gradle user home, including the local build cache that
      # `-Dorg.gradle.caching=true` (set by scripts/release/build-android-apk.mjs)
      # writes into. Read-only here: a cache saved from `refs/tags/vX.Y.Z` is
      # scoped to that ref and unreadable by the next tag. The entry this reads
      # is the one CI on main writes, building the same `:app:assembleRelease`
      # for arm64-v8a via .github/workflows/build-selected.yml, where
      # setup-gradle's default (write on the default branch, read elsewhere)
      # applies. Gradle keys cached task outputs by input hashes, not by
      # location, so `expo prebuild --clean` wiping and regenerating
      # apps/ui/android between runs does not by itself invalidate them.
      # A self-hosted runner keeps its Gradle home on disk, so skips this cache.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          cache-disabled: ${{ vars.FROGG_ANDROID_RUNNER == 'self-hosted' }}

      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci

      # The keystore is a base64-encoded .jks/.keystore in a secret; without it
      # the APK is debug-signed and named `-unsigned` (see release-process.mdx).
      - name: Prepare release keystore
        if: needs.meta.outputs.android_signing == 'true'
        env:
          FROGG_ANDROID_KEYSTORE_BASE64: ${{ secrets.FROGG_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$FROGG_ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/frogg-release.keystore"
          echo "FROGG_ANDROID_KEYSTORE=$RUNNER_TEMP/frogg-release.keystore" >> "$GITHUB_ENV"

      # Gradle runs one worker here. Parallelism was measured and does not
      # work at these heap caps: `--workers 3` (run 35323297692) and
      # `--workers 2` (run 35325084445) both died the same way, roughly 15-17
      # minutes into the Gradle invocation, each a few minutes after Gradle
      # logged "The Daemon will expire after the build after running out of JVM
      # Metaspace" against the 512 MiB cap. Neither produced a Gradle failure or
      # a Java OutOfMemoryError; the runner agent itself went away. `--serial`
      # is the configuration that has actually shipped releases (19m13s for
      # v1.5.0, 22m11s for v1.4.1).
      #
      # More workers load more classes at once, so the metaspace ceiling that is
      # fine at one worker is not at two. If parallelism is worth revisiting,
      # raise -XX:MaxMetaspaceSize (see gradleArgsFor) before raising the worker
      # count -- that is what the log actually complains about.
      #
      # The self-hosted Windows runner (64 GB) runs two workers: 7m16s of Gradle warm,
      # against 8m13s at one (runs 35370051842, 35370040429).
      - name: Build release APK
        env:
          GRADLE_WORKER_ARGS: ${{ vars.FROGG_ANDROID_RUNNER == 'self-hosted' && '--workers 2' || '--serial' }}
          FROGG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FROGG_ANDROID_KEYSTORE_PASSWORD }}
          FROGG_ANDROID_KEY_ALIAS: ${{ secrets.FROGG_ANDROID_KEY_ALIAS || 'frogg' }}
          FROGG_ANDROID_KEY_PASSWORD: ${{ secrets.FROGG_ANDROID_KEY_PASSWORD }}
        run: >-
          node scripts/release/build-android-apk.mjs
          --abi ${{ matrix.abi }}
          $GRADLE_WORKER_ARGS
          --out-dir release-assets

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CLOBBER: ${{ needs.meta.outputs.clobber }}
        run: |
          flags=()
          if [ "$CLOBBER" = "true" ]; then flags+=(--clobber); fi
          ls -l release-assets
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for f in release-assets/*-android-*.apk; do
            n=$(basename "$f")
            if [ "$CLOBBER" != "true" ] && grep -qx -- "$n" <<<"$existing"; then
              echo "::warning::$n already on $RELEASE_TAG; skipping"
              continue
            fi
            gh release upload "$RELEASE_TAG" "$f" "${flags[@]}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-android-${{ matrix.abi }}
          path: release-assets
          retention-days: 7

  updater-manifest:
    name: Release metadata and update compatibility
    needs: [meta, desktop]
    if: inputs.only != 'android' && needs.meta.outputs.build_all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: ./.github/actions/setup-node-deps
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true
      - name: Build release metadata and compatibility manifests
        run: node scripts/release/build-release-metadata.mjs --version ${{ needs.meta.outputs.version }} --assets release-assets --out release-metadata
      - name: Upload metadata
        env:
          GH_TOKEN: ${{ github.token }}
          CLOBBER: ${{ needs.meta.outputs.clobber }}
        run: |
          flags=()
          if [ "$CLOBBER" = "true" ]; then flags+=(--clobber); fi
          gh release upload "$RELEASE_TAG" release-metadata/* "${flags[@]}"
      - name: Verify uploaded update contract
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-release-assets.mjs --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
  docker:
    name: docker image
    needs: meta
    if: inputs.only != 'android' && (needs.meta.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
          token: ${{ secrets.BRANDING_READ_TOKEN }}

      - uses: ./.github/actions/setup-node-deps
      - name: Resolve container distribution
        run: |
          image=$(node -p 'require("./.generated/branding/brand.json").distribution.dockerImage || ""')
          test -n "$image" || { echo 'Configure distribution.dockerImage to publish containers'; exit 1; }
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "BRAND_BUILD_INPUT=$(node --import tsx scripts/dev/brand.mts stage)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Exact version tags are immutable: if one exists, nothing is pushed. Fix a bad
      # image by bumping the patch version and cutting a new release.
      - name: Compute tags
        id: tags
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::warning::$IMAGE:$VERSION already exists on Docker Hub; skipping push."
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags="$IMAGE:$VERSION"
          # Betas never move the rolling tags. A fork rebuild (1.8.0-acme.2) moves them from its
          # upstream version's numbers.
          if [ "$FROGG_BRAND_CHANNEL" = "stable" ]; then
            core="${VERSION%%-*}"
            major="${core%%.*}"
            minor="${core%.*}"
            tags="$tags,$IMAGE:$minor,$IMAGE:$major,$IMAGE:latest"
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Pushing: $tags"

      - uses: docker/setup-buildx-action@v4
        if: steps.tags.outputs.push == 'true'

      - uses: docker/build-push-action@v7
        if: steps.tags.outputs.push == 'true'
        with:
          context: .
          file: deploy/docker/base/Dockerfile
          build-args: |
            FROGG_BRAND_DIR=${{ env.BRAND_BUILD_INPUT }}
            FROGG_BRAND_CHANNEL=${{ env.FROGG_BRAND_CHANNEL }}
            FROGG_SOURCE_REVISION=${{ github.sha }}
            FROGG_VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: publish completed release
    needs: [meta, desktop, daemon-bundle, android, updater-manifest, docker]
    if: >-
      always() && needs.meta.result == 'success' &&
      needs.meta.outputs.build_all == 'true' &&
      needs.desktop.result == 'success' && needs.daemon-bundle.result == 'success' &&
      needs.android.result == 'success' && needs.updater-manifest.result == 'success' &&
      (needs.docker.result == 'success' || needs.docker.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Publish only after every required platform succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        # Latest only ever moves forward: when two runs finish out of order, the
        # older version publishes without taking Latest from the newer one.
        # `gh release view` with no tag returns the current Latest.
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
            exit 0
          fi
          current="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          newest="$(printf '%s\n%s\n' "${current#v}" "${RELEASE_TAG#v}" | sort -V | tail -n1)"
          if [ -z "$current" ] || [ "$newest" = "${RELEASE_TAG#v}" ]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            echo "::warning::$current is newer than $RELEASE_TAG; publishing without moving Latest."
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi
