name: Build selected clients and daemon

on:
  workflow_dispatch:
    inputs:
      target:
        description: Artifact to build
        type: choice
        default: all
        options: [all, windows, daemon, android]
      windows_runner:
        description: Windows client runner (repo default follows vars.FROGG_WINDOWS_RUNNER)
        type: choice
        default: repo-default
        options: [repo-default, self-hosted, hosted]
      android_runner:
        description: Android runner (repo default follows vars.FROGG_ANDROID_RUNNER)
        type: choice
        default: repo-default
        options: [repo-default, self-hosted, hosted]
      android_workers:
        description: Gradle workers for the Android build (self-hosted only; hosted stays at 1)
        type: string
        default: "2"
  workflow_call:
    inputs:
      target:
        type: string
        default: all

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"

jobs:
  windows:
    if: inputs.target == 'all' || inputs.target == 'windows'
    name: Windows x64 client
    runs-on: ${{ fromJSON((inputs.windows_runner == 'self-hosted' || ((inputs.windows_runner == '' || inputs.windows_runner == 'repo-default') && vars.FROGG_WINDOWS_RUNNER == 'self-hosted')) && '["self-hosted","windows","android-win"]' || '"windows-latest"') }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
      - uses: ./.github/actions/setup-node-deps
      - run: npm run install:electron --workspace=@frogg/desktop
      - run: npm run build:app-deps
      - run: npm run test --workspace=@frogg/desktop
      - name: Build app-only client
        run: npm run build:desktop -- --target win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-client-${{ github.sha }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  daemon:
    if: inputs.target == 'all' || inputs.target == 'daemon'
    name: Linux x64 daemon
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
      - uses: ./.github/actions/setup-node-deps
      - name: Build daemon and its web UI
        run: npm run build:server && npm run build:daemon-web-ui
      - name: Package daemon
        run: npm run build:daemon-bundle -- --target linux-x64 --out-dir dist/bundles
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64-daemon-${{ github.sha }}
          path: |
            dist/bundles/*.tar.gz
            dist/bundles/*.sha256
          if-no-files-found: error
          retention-days: 14

  android:
    if: inputs.target == 'all' || inputs.target == 'android'
    name: Android arm64 client (debug-signed)
    runs-on: ${{ fromJSON((inputs.android_runner == 'self-hosted' || ((inputs.android_runner == '' || inputs.android_runner == 'repo-default') && vars.FROGG_ANDROID_RUNNER == 'self-hosted')) && '["self-hosted","windows","android-win"]' || '"ubuntu-latest"') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/select-brand
        with:
          directory: ${{ vars.FROGG_BRAND_DIR }}
          repository: ${{ vars.FROGG_BRAND_REPOSITORY }}
          revision: ${{ vars.FROGG_BRAND_REVISION }}
          subdirectory: ${{ vars.FROGG_BRAND_SUBDIR }}
      # The disk cleanup and SDK trim only make sense on a throwaway hosted VM.
      - name: Free runner disk space for Android
        if: ${{ !(inputs.android_runner == 'self-hosted' || ((inputs.android_runner == '' || inputs.android_runner == 'repo-default') && vars.FROGG_ANDROID_RUNNER == 'self-hosted')) }}
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Trim unused runner Android SDK components
        if: ${{ !(inputs.android_runner == 'self-hosted' || ((inputs.android_runner == '' || inputs.android_runner == 'repo-default') && vars.FROGG_ANDROID_RUNNER == 'self-hosted')) }}
        run: sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # A self-hosted runner has the SDK preinstalled at ANDROID_HOME (set in the
      # runner's .env); this action can't unzip on the Windows PC.
      - uses: android-actions/setup-android@v4
        if: ${{ !(inputs.android_runner == 'self-hosted' || ((inputs.android_runner == '' || inputs.android_runner == 'repo-default') && vars.FROGG_ANDROID_RUNNER == 'self-hosted')) }}
        with:
          # sdkmanager no longer provides the obsolete tools package.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      # A self-hosted runner keeps its Gradle cache on disk between runs, so skip
      # the round trip through the Actions cache there.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: ${{ (inputs.android_runner == 'self-hosted' || ((inputs.android_runner == '' || inputs.android_runner == 'repo-default') && vars.FROGG_ANDROID_RUNNER == 'self-hosted')) }}
      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci
      - name: Build test APK
        # One worker: see the release workflow's android job for the measured
        # reason. Two and three workers both exhausted the runner.
        # Only the self-hosted runner has the memory for more.
        env:
          GRADLE_WORKER_ARGS: ${{ (inputs.android_runner == 'self-hosted' || ((inputs.android_runner == '' || inputs.android_runner == 'repo-default') && vars.FROGG_ANDROID_RUNNER == 'self-hosted')) && format('--workers {0}', inputs.android_workers || '2') || '--serial' }}
        run: node scripts/release/build-android-apk.mjs --abi arm64-v8a $GRADLE_WORKER_ARGS --out-dir release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-debug-signed-${{ github.sha }}
          path: release-assets/*-android-*.apk
          if-no-files-found: error
          retention-days: 14
