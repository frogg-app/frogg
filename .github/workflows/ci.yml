name: CI

on:
  push:
    # Both release streams (frogg.json "streams"). A green main push cuts the next beta (the
    # `beta` job below); stable only reruns tests for commits main never tested (backports).
    branches: [main, stable]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  # CI never uses the CUDA execution provider; the onnxruntime-node postinstall
  # download is large enough to make `npm ci` flaky.
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tests: ${{ steps.plan.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Release cuts and promotions only change versions on code main already tested; the
      # release workflow checks that main run instead of repeating it here. Code on main is
      # only "already tested" if CI passed on it: a feature pushed together with its cut never
      # had a run of its own, so without one the tests run here.
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tests="$(node scripts/release/streams.mjs needs-tests HEAD)"
          if [ "$tests" = false ]; then
            source="$(node scripts/release/streams.mjs tested-source HEAD)"
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$source&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | map(.status + ":" + (.conclusion // "")) | join(" ")')"
            case " $runs " in
              *" completed:success "*) echo "CI already passed on $(git log -1 --format=%s "$source")." ;;
              *) echo "No passing CI run on $(git log -1 --format=%s "$source"); running tests."; tests=true ;;
            esac
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  checks:
    name: format, lint, typecheck
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-deps

      - name: Check formatting
        run: npx oxfmt --check .

      - name: Lint
        run: npx oxlint .

      # Workspaces typecheck against each other's dist/ output, so the server stack
      # (protocol, client, highlight, relay, server, cli) is built first.
      - name: Build server stack
        run: npm run build:server

      - name: Build native audio declarations
        run: npm run build --workspace=@frogg/expo-two-way-audio

      - name: Typecheck
        run: npm run typecheck

      # After the build: some script tests import built workspace output (protocol's dist).
      - name: Script tests
        run: npm run test:scripts

  tests:
    name: unit tests (libraries, cli)
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - name: Build library dependencies
        # The CLI unit tests import @frogg/server (the claim and self-update commands), so the
        # server and CLI dists have to exist too, not just the shared libraries.
        run: npm run build:server

      - name: Test protocol, client, highlight, relay
        run: >-
          npm run test
          --workspace=@frogg/protocol
          --workspace=@frogg/client
          --workspace=@frogg/highlight
          --workspace=@frogg/relay

      - name: Test cli (unit)
        run: npm run test:unit --workspace=@frogg/cli

  ui-tests:
    # The ui suite is the longest job in the pipeline, and its two vitest
    # projects have different needs: `unit` is 597 files of plain node tests,
    # `browser` is 11 files that need a Chromium download. Splitting them keeps
    # the Playwright install off the shards, and sharding the rest turns a
    # single long job into three short ones.
    name: unit tests (ui) ${{ matrix.shard }}/3
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - name: Build library dependencies
        # Deps only: the ui imports @frogg/client and @frogg/protocol but never
        # @frogg/server, and the CLI tests that did moved to their own job.
        run: npm run build:server-deps && npm run build --workspace=@frogg/expo-two-way-audio

      - name: Test ui (unit)
        run: >-
          npx vitest run --root apps/ui --project unit
          --shard=${{ matrix.shard }}/3

  ui-browser-tests:
    name: browser tests (ui)
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Build library dependencies
        run: npm run build:server-deps && npm run build --workspace=@frogg/expo-two-way-audio

      - name: Test ui (browser)
        run: npx vitest run --root apps/ui --project browser

  server-tests:
    name: unit tests (server) ${{ matrix.shard }}/5
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Five, not three. vitest shards by file count rather than duration, and
        # the server's slow files clustered in shard 1 - it ran 272s against the
        # others' 149s, making it the whole pipeline's critical path. More,
        # smaller shards blunt that imbalance without needing to know which
        # files are slow.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
        with:
          # Worktree tests compare against origin/main.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-deps

      - name: Build server dependencies
        run: npm run build:server-deps

      - name: Test server (unit, no e2e)
        run: npx vitest run --root packages/server --fileParallelism --exclude "**/*.e2e.test.ts" --shard=${{ matrix.shard }}/5

  # Every green push to main ships as the next beta. The cut is pushed with GITHUB_TOKEN, which
  # starts no workflows (so no CI loop), and the release is dispatched explicitly instead.
  beta:
    name: cut beta
    needs: [plan, checks, tests, ui-tests, ui-browser-tests, server-tests]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.plan.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    concurrency:
      group: beta-cut
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Skip if main has moved on
        id: current
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::notice::main moved past $GITHUB_SHA; the newer push cuts the beta."
            echo "cut=false" >> "$GITHUB_OUTPUT"
          else
            echo "cut=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.current.outputs.cut == 'true'
        uses: ./.github/actions/setup-node-deps

      - name: Cut and push the beta
        if: steps.current.outputs.cut == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          node scripts/release/streams.mjs beta --skip-check

      # Betas publish, so they need the full matrix; the default set only builds a draft.
      - name: Start the release build
        if: steps.current.outputs.cut == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f platforms=all -f tag="v$(node -p "require('./package.json').version")"
