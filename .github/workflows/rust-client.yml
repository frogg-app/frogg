name: Rust client

# apps/client, the Rust Frogg Next client "Frogg Next RS" (docs/plans/rust-client.md).
#
# - check: the UI compiles for wasm32 and the core, render and UI tests pass.
# - desktop: Tauri bundles for linux-x64 (deb, AppImage), windows-x64 (nsis) and macos-arm64
#   (dmg, ad-hoc signed). With FROGG_NEXT_RS_UPDATER_KEY set, the updater artifacts (signed
#   AppImage, nsis exe and .app.tar.gz, each with a .sig) are produced too.
# - android: a universal-ABI release APK, signed with Frogg Next's keystore (or the classic app's)
#   when the secrets are present, else with the debug key.
# Every bundle is uploaded as a workflow artifact named frogg-next-rs-<platform>.
# - release: only when the Release workflow calls this with `release-tag` (every `-next.N` tag).
#   Attaches Frogg-Next-RS-<version>-<platform>-<arch>.<ext>, their .sig files, one
#   Frogg-Next-RS-<version>-SHA256SUMS and, when signed, frogg-next-rs-latest.json (Tauri's static
#   updater feed, scripts/release/rust-client-assets.mjs) to that tag's GitHub release. Without
#   FROGG_NEXT_RS_UPDATER_KEY everything but the feed and signatures still ships.

on:
  push:
    branches: [frogg-next]
    paths:
      - apps/client/**
      - crates/**
      - .github/workflows/rust-client.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: "Release tag to build and attach the assets to"
        required: true
        type: string
      clobber:
        description: "'true' when the calling run created the release and may overwrite its assets"
        required: false
        default: "false"
        type: string
    outputs:
      signed:
        description: "'true' when frogg-next-rs-latest.json (and the .sig files) were uploaded"
        value: ${{ jobs.release.outputs.signed }}
    # All optional: without them the bundles ship unsigned for the updater and the APK debug-signed.
    secrets:
      FROGG_NEXT_RS_UPDATER_KEY:
        required: false
      FROGG_NEXT_RS_UPDATER_KEY_PASSWORD:
        required: false
      FROGG_NEXT_ANDROID_KEYSTORE_BASE64:
        required: false
      FROGG_NEXT_ANDROID_KEYSTORE_PASSWORD:
        required: false
      FROGG_NEXT_ANDROID_KEY_ALIAS:
        required: false
      FROGG_NEXT_ANDROID_KEY_PASSWORD:
        required: false
      FROGG_ANDROID_KEYSTORE_BASE64:
        required: false
      FROGG_ANDROID_KEYSTORE_PASSWORD:
        required: false
      FROGG_ANDROID_KEY_ALIAS:
        required: false
      FROGG_ANDROID_KEY_PASSWORD:
        required: false

# A release call runs inside the Release workflow's run and must never cancel or be cancelled by
# a branch push build, so it gets its own group.
concurrency:
  group: rust-client-${{ inputs.release-tag || github.ref }}
  cancel-in-progress: ${{ !inputs.release-tag }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client
          key: check
      - name: UI compiles for wasm32
        working-directory: apps/client
        run: cargo check -p frogg-ui --target wasm32-unknown-unknown
      - name: Core, render and UI tests
        working-directory: apps/client
        run: cargo test -p frogg-client-core -p frogg-render -p frogg-ui

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-x64
            os: windows-latest
            bundles: nsis
          - platform: macos-arm64
            os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.ref }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client
          key: ${{ matrix.platform }}
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      - name: Build bundles
        working-directory: apps/client/src-tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.FROGG_NEXT_RS_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.FROGG_NEXT_RS_UPDATER_KEY_PASSWORD }}
        run: |
          args=(--bundles "${{ matrix.bundles }}" --ci)
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Updater key present: building updater artifacts."
            args+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "No FROGG_NEXT_RS_UPDATER_KEY: bundles only, no updater signatures."
          fi
          cargo tauri build "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: frogg-next-rs-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            apps/client/target/release/bundle/deb/*.deb
            apps/client/target/release/bundle/appimage/*.AppImage
            apps/client/target/release/bundle/appimage/*.AppImage.sig
            apps/client/target/release/bundle/nsis/*.exe
            apps/client/target/release/bundle/nsis/*.exe.sig
            apps/client/target/release/bundle/dmg/*.dmg
            apps/client/target/release/bundle/macos/*.app.tar.gz
            apps/client/target/release/bundle/macos/*.app.tar.gz.sig

  android:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;27.2.12479018
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client
          key: android
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk,tauri-cli
      # Frogg Next's keystore wins when it and its password are set, else the classic app's,
      # else the APK is signed with the debug key (build.gradle.kts reads keystore.properties).
      - name: Signing
        env:
          NEXT_KEYSTORE_BASE64: ${{ secrets.FROGG_NEXT_ANDROID_KEYSTORE_BASE64 }}
          NEXT_KEYSTORE_PASSWORD: ${{ secrets.FROGG_NEXT_ANDROID_KEYSTORE_PASSWORD }}
          NEXT_KEY_ALIAS: ${{ secrets.FROGG_NEXT_ANDROID_KEY_ALIAS }}
          NEXT_KEY_PASSWORD: ${{ secrets.FROGG_NEXT_ANDROID_KEY_PASSWORD }}
          CLASSIC_KEYSTORE_BASE64: ${{ secrets.FROGG_ANDROID_KEYSTORE_BASE64 }}
          CLASSIC_KEYSTORE_PASSWORD: ${{ secrets.FROGG_ANDROID_KEYSTORE_PASSWORD }}
          CLASSIC_KEY_ALIAS: ${{ secrets.FROGG_ANDROID_KEY_ALIAS }}
          CLASSIC_KEY_PASSWORD: ${{ secrets.FROGG_ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/frogg-next-rs.keystore"
          props=apps/client/src-tauri/gen/android/keystore.properties
          if [ -n "$NEXT_KEYSTORE_BASE64" ] && [ -n "$NEXT_KEYSTORE_PASSWORD" ]; then
            echo "Signing with the Frogg Next keystore (FROGG_NEXT_ANDROID_*)."
            echo "$NEXT_KEYSTORE_BASE64" | base64 -d > "$keystore"
            alias="${NEXT_KEY_ALIAS:-frogg-next}"; store_pw="$NEXT_KEYSTORE_PASSWORD"
            key_pw="${NEXT_KEY_PASSWORD:-$NEXT_KEYSTORE_PASSWORD}"
          elif [ -n "$CLASSIC_KEYSTORE_BASE64" ] && [ -n "$CLASSIC_KEYSTORE_PASSWORD" ]; then
            echo "Signing with the classic app's keystore (FROGG_ANDROID_*)."
            echo "$CLASSIC_KEYSTORE_BASE64" | base64 -d > "$keystore"
            alias="${CLASSIC_KEY_ALIAS:-frogg}"; store_pw="$CLASSIC_KEYSTORE_PASSWORD"
            key_pw="${CLASSIC_KEY_PASSWORD:-$CLASSIC_KEYSTORE_PASSWORD}"
          else
            echo "No Android signing secrets: the APK is debug-signed."
            exit 0
          fi
          {
            echo "storeFile=$keystore"
            echo "storePassword=$store_pw"
            echo "keyAlias=$alias"
            echo "keyPassword=$key_pw"
          } > "$props"
      - name: Build APK
        working-directory: apps/client/src-tauri
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          cargo tauri android build --apk --ci
      - uses: actions/upload-artifact@v7
        with:
          name: frogg-next-rs-android
          if-no-files-found: error
          path: apps/client/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  # The only job with write access, and only on a release call: the builds above stay read-only.
  release:
    name: Attach to GitHub release
    needs: [desktop, android]
    if: inputs.release-tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      signed: ${{ steps.collect.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release-tag }}
          persist-credentials: false
          sparse-checkout: |
            scripts/release
            scripts/ci
      - uses: actions/download-artifact@v8
        with:
          pattern: frogg-next-rs-*
          path: bundles
      - name: Name assets and build the updater feed
        id: collect
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          node scripts/release/rust-client-assets.mjs --in bundles --out frogg-next-rs \
            --version "${RELEASE_TAG#v}" --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          if [ -f frogg-next-rs/frogg-next-rs-latest.json ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          CLOBBER: ${{ inputs.clobber }}
        run: |
          version="${RELEASE_TAG#v}"
          cd frogg-next-rs
          shopt -s nullglob
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          # Installers and signatures before the feed: an updater that sees the feed must find them.
          for f in "Frogg-Next-RS-$version"-* frogg-next-rs-latest.json; do
            [ -f "$f" ] || continue
            if [ "$CLOBBER" != "true" ] && grep -qx -- "$f" <<<"$existing"; then
              echo "::warning::$f already on $RELEASE_TAG; skipping"
              continue
            fi
            bash "$GITHUB_WORKSPACE/scripts/ci/release-upload.sh" "$RELEASE_TAG" "$f" "$CLOBBER"
          done
