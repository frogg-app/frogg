name: ui-next Android prototype

# Debug-signed APK of the apps/ui-next prototype (package app.frogg.next), built on every push
# to the prototype branch. Not part of releases.
on:
  push:
    branches: [frogg-interface-design-mockups]
    paths:
      - "apps/ui-next/**"
      - "packages/client/**"
      - "packages/protocol/**"
      - "packages/highlight/**"
      - "package-lock.json"
      - ".github/workflows/ui-next-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-next-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  CI: "true"
  LEFTHOOK: "0"

jobs:
  apk:
    name: Android arm64 APK (debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - run: sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/emulator /usr/local/lib/android/sdk/system-images
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Install dependencies
        run: node scripts/ci/npm-retry.mjs ci
      - name: Build workspace packages
        run: npm run build:highlight && npm run build:client
      - name: Build APK
        run: node apps/ui-next/scripts/build-apk.mjs release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: frogg-next-android-arm64-${{ github.sha }}
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 14
