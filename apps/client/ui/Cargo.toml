[package]
name = "frogg-ui"
description = "Frogg client UI (Leptos, compiled to WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
frogg-client-core.workspace = true
leptos.workspace = true
frogg-render.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "Location"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde_json.workspace = true

# native/ (the Tauri bridge and its web fallbacks). A separate table so other streams' feature
# edits to the main web-sys line never conflict; features unify.
[target.'cfg(all())'.dependencies]
wasm-bindgen-futures = "0.4"
serde = { workspace = true }
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "File",
  "FileList",
  "Blob",
  "Navigator",
  "Clipboard",
  "Notification",
  "NotificationOptions",
  "NotificationPermission",
  "UrlSearchParams",
  "EventTarget",
  "Event",
] }
