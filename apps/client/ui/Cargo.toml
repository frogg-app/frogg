[package]
name = "frogg-ui"
description = "Frogg client UI (Leptos, compiled to WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
frogg-client-core.workspace = true
leptos.workspace = true
frogg-render.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Storage",
  "Window",
  "Location",
  "Navigator",
  "MediaQueryList",
  "UrlSearchParams",
  "HtmlElement",
  "CssStyleDeclaration",
  "KeyboardEvent",
  "Element",
  "WebSocket",
  "MessageEvent",
  "Event",
  "Request",
  "RequestInit",
  "Response",
  "Headers",
  "History",
  "KeyboardEventInit",
] }
futures.workspace = true
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde_json.workspace = true

# native/ (the Tauri bridge and its web fallbacks). A separate table so other streams' feature
# edits to the main web-sys line never conflict; features unify.
[target.'cfg(all())'.dependencies]
wasm-bindgen-futures = "0.4"
serde = { workspace = true }
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "NodeList",
  "File",
  "FileList",
  "Blob",
  "Navigator",
  "Clipboard",
  "Notification",
  "NotificationOptions",
  "NotificationPermission",
  "UrlSearchParams",
  "EventTarget",
  "Event",
] }

# views/sessions (popover anchoring, textarea focus). Own table so feature edits never conflict.
[target.'cfg(not(target_os = "none"))'.dependencies]
web-sys = { version = "0.3", features = [
  "DomRect",
  "MouseEvent",
  "HtmlTextAreaElement",
  "HtmlInputElement",
  "TouchEvent",
  "TouchList",
  "Touch",
] }

# views/chat (lightbox, composer resize). Own table so feature edits never conflict; features unify.
[target.'cfg(not(target_os = "plan9"))'.dependencies]
web-sys = { version = "0.3", features = ["HtmlImageElement", "DomTokenList", "PointerEvent", "VisualViewport"] }

# views/panels (terminal drops, downloads). Own table so feature edits never conflict; features unify.
[target.'cfg(any(unix, not(unix)))'.dependencies]
web-sys = { version = "0.3", features = [
  "DragEvent",
  "DataTransfer",
  "Url",
  "BlobPropertyBag",
  "HtmlAnchorElement",
  "HtmlTextAreaElement",
  # shell/back (Android back closes sheets opened from the root).
  "MutationObserver",
  "MutationObserverInit",
] }

# views/chat (bottom anchor on content resize). Own table so feature edits never conflict.
[target.'cfg(not(target_os = "haiku"))'.dependencies]
web-sys = { version = "0.3", features = ["ResizeObserver"] }

# views/panels/hosts (pairing QR). Own table so dependency edits never conflict.
[target.'cfg(not(target_os = "solaris"))'.dependencies]
qrcodegen = "1.8"

# views/chat reveal (streamed text spans). Own table so feature edits never conflict; features unify.
[target.'cfg(not(target_os = "redox"))'.dependencies]
web-sys = { version = "0.3", features = ["Node", "Text", "CharacterData", "Performance"] }
