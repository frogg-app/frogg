[package]
name = "frogg-ui"
description = "Frogg client UI (Leptos, compiled to WASM)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
frogg-client-core.workspace = true
leptos.workspace = true
frogg-render.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Storage",
  "Window",
  "Location",
  "Navigator",
  "MediaQueryList",
  "UrlSearchParams",
  "HtmlElement",
  "CssStyleDeclaration",
  "KeyboardEvent",
  "Element",
  "WebSocket",
  "MessageEvent",
  "Event",
] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
serde_json.workspace = true
serde.workspace = true
