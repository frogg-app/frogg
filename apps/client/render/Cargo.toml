[package]
name = "frogg-render"
description = "Frogg content renderers: markdown, syntax highlighting, diffs, terminal (Leptos)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
leptos.workspace = true
serde.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }
similar = { version = "2", default-features = false, features = ["text"] }
vt100 = "0.15"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "Clipboard",
  "ClipboardEvent",
  "CompositionEvent",
  "Event",
  "CssStyleDeclaration",
  "DataTransfer",
  "DomRect",
  "Element",
  "HtmlElement",
  "HtmlTextAreaElement",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "ResizeObserver",
  "ResizeObserverEntry",
  "Selection",
  "WheelEvent",
  "Window",
] }

[dev-dependencies]
serde_json.workspace = true
