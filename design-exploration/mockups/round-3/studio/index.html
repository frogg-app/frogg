<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Studio — Frogg round 3</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../round-1/_shared/base.css" />
    <link rel="stylesheet" href="../_shared/r3.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-view="session">
    <header class="nav">
      <a class="brand" href="#"
        ><img src="frogg-logo.png" alt="" width="30" height="24" /><span
          >frogg<span class="tld">.app</span></span
        ></a
      >
      <nav class="links">
        <button class="on" data-view-to="session">Sessions</button
        ><button data-view-to="overview">Overview</button><button>Plugins</button
        ><button>Settings</button>
      </nav>
      <button class="search" data-pal>
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" /></svg
        ><span>Jump to session</span><kbd>⌘K</kbd>
      </button>
      <div class="hosts">
        <span class="pill ok">devbox</span><span class="pill ok">macbook</span
        ><span class="pill off">ci-runner-2</span>
      </div>
    </header>
    <div class="ws">
      <aside class="side">
        <div class="side-h">
          <p class="eyebrow">Sessions</p>
          <button class="btn-new">New <kbd>⌘N</kbd></button>
        </div>
        <div class="filters" id="filters"></div>
        <div class="list" id="rows"></div>
      </aside>
      <main class="center">
        <section class="hero" id="hero">
          <canvas id="facets" aria-hidden="true"></canvas>
          <div class="veil"></div>
          <div class="hero-c">
            <button class="m-back" data-back>← Sessions</button>
            <p class="eyebrow" id="eyebrow"></p>
            <h1 id="title"></h1>
            <div class="hero-row">
              <span id="pill"></span><span class="hero-m" id="meta"></span><span class="sp"></span
              ><button class="cta ghost">Fork</button
              ><button class="cta primary">Open PR <span>→</span></button>
            </div>
          </div>
        </section>
        <div class="scroll" id="scroll"><div class="chat" id="chat"></div></div>
        <div class="dock">
          <div id="strip"></div>
          <div id="composer"></div>
        </div>
      </main>
      <aside class="pane">
        <div class="card stats" data-spot id="stats"></div>
        <div class="card" data-spot>
          <div class="card-h">
            <p class="eyebrow">Changes</p>
            <button class="link">Review all</button>
          </div>
          <div id="changes"></div>
        </div>
        <div class="card" data-spot>
          <div class="card-h">
            <p class="eyebrow">Checks</p>
            <span class="pill run">running</span>
          </div>
          <div id="ci"></div>
        </div>
      </aside>
      <section class="overview" id="overview">
        <div class="ov-h">
          <div>
            <p class="eyebrow">Overview</p>
            <h2>Everything in <span class="gradient-text">flight.</span></h2>
          </div>
          <div class="filters big" id="filters2"></div>
        </div>
        <div class="grid" id="grid"></div>
      </section>
    </div>
    <a class="dirnav" href="../index.html">← round 3</a>
    <script src="../../round-1/_shared/core.js"></script>
    <script src="../../round-2/_shared/kit.js"></script>
    <script src="../_shared/r3.js"></script>
    <script src="terrain.js"></script>
    <script src="app.js"></script>
  </body>
</html>
