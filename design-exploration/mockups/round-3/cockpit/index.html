<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cockpit — Frogg round 3 remix</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../round-1/_shared/base.css" />
    <link rel="stylesheet" href="../_shared/r3.css" />
    <link rel="stylesheet" href="../_remix/parts.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="row-f grow">
      <nav class="rail" id="rail"></nav>
      <aside class="side col" style="width: 270px">
        <div class="lh">
          <h2 class="scope" id="scopeName"></h2>
          <button class="search" data-pal>Search <kbd>⌘K</kbd></button>
        </div>
        <button class="fleet" id="fleet"></button>
        <div class="tree" id="tree">
          <div class="notch" id="notch"></div>
          <div id="treeRows"></div>
        </div>
      </aside>
      <main class="main col grow">
        <div class="tabs" id="tabs"></div>
        <div class="sh">
          <div class="sh-t">
            <div class="crumb" id="crumb"></div>
            <h1><button class="m-back" data-back>←</button><span id="title"></span></h1>
            <div class="meta" id="meta"></div>
          </div>
          <div class="acts">
            <button class="btn ghost" data-pane="changes">Changes <b id="chgN"></b></button
            ><button class="btn ghost" data-pane="terminal">Terminal</button
            ><button class="btn ghost" data-pane="ci">CI</button
            ><button class="btn">Open PR</button>
          </div>
        </div>
        <div class="row-f grow">
          <div class="chatcol">
            <div class="scroll" id="scroll"><div class="chat" id="chat"></div></div>
            <div class="dock">
              <div id="strip"></div>
              <div id="composer"></div>
            </div>
          </div>
          <aside class="pane">
            <nav class="ptabs" id="paneTabs">
              <span class="pind" id="paneInd"></span
              ><button class="on" data-pane="changes">Changes</button
              ><button data-pane="terminal">Terminal</button><button data-pane="ci">PR · CI</button
              ><button class="x" data-pane-close>✕</button>
            </nav>
            <div class="pbody" id="paneBody"></div>
          </aside>
        </div>
        <section class="panel">
          <div class="panel-tabs">
            <button class="on">Terminal</button><button>Problems <b>1</b></button
            ><button>Output</button><span class="sp"></span
            ><button data-panel-toggle>⌄ <kbd>`</kbd></button>
          </div>
          <div class="panel-body" id="panelBody"></div>
        </section>
      </main>
    </div>
    <footer class="status" id="status"></footer>
    <a class="dirnav" href="../index.html#remix">← round 3</a>
    <script src="../../round-1/_shared/core.js"></script>
    <script src="../../round-2/_shared/kit.js"></script>
    <script src="../_shared/r3.js"></script>
    <script src="../_remix/remix.js"></script>
    <script src="app.js"></script>
  </body>
</html>
