<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Metro — Frogg round 2</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,400;0,600;0,800;0,900;1,400&family=Overpass+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../round-1/_shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="board">
      <div class="roundel"><span>frogg</span></div>
      <div class="dep" id="dep"></div>
      <button class="find" data-pal>Find <kbd>⌘K</kbd></button>
    </header>
    <div class="split">
      <nav class="map" id="map"></nav>
      <main class="ride">
        <div class="ride-h">
          <button class="m-back" data-back>← map</button>
          <div class="line-badge" id="badge"></div>
          <h1 id="title"></h1>
          <div class="meta" id="meta"></div>
        </div>
        <div class="ride-body" id="scroll"><div class="chat" id="chat"></div></div>
        <div class="dock">
          <div id="strip"></div>
          <div id="composer"></div>
        </div>
      </main>
    </div>
    <a class="dirnav" href="../index.html">← round 2</a>
    <script src="../../round-1/_shared/core.js"></script>
    <script src="../_shared/kit.js"></script>
    <script src="app.js"></script>
  </body>
</html>
