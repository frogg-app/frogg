<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blueprint — Frogg round 2</title>
    <link

        <div class="dock">

          <div id="composer"></div>
