<path d="M 574 208 L 604 208" fill="none" stroke="#a3adab" stroke-width="2" marker-end="url(#arrow-muted)"/>
<path d="M 864 208 L 894 208" fill="none" stroke="#a3adab" stroke-width="2" marker-end="url(#arrow-muted)"/>
<path d="M 1025 290 L 1025 358" fill="none" stroke="#4cc38a" stroke-width="2" marker-end="url(#arrow-stable)"/>
<path d="M 896 432 L 866 432" fill="none" stroke="#a3adab" stroke-width="2" marker-end="url(#arrow-muted)"/>
<path d="M 606 432 L 576 432" fill="none" stroke="#a3adab" stroke-width="2" marker-end="url(#arrow-muted)"/>
<path d="M 316 432 L 286 432" fill="none" stroke="#a3adab" stroke-width="2" marker-end="url(#arrow-muted)"/>
<path d="M 735 136 C 735 98, 155 98, 155 132" fill="none" stroke="#e0a95b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-backport)"/>
<text x="445" y="94" font-size="15.5" font-weight="600" fill="#e0a95b" text-anchor="middle">not right yet: edit again</text>
<text x="1037" y="330" font-size="15.5" font-weight="600" fill="#4cc38a" text-anchor="start">works</text>
</svg>
