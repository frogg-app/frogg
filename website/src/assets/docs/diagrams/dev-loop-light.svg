<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="540" viewBox="0 0 1180 540" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow-stable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8a55"/></marker>
<marker id="arrow-beta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77700"/></marker>
<marker id="arrow-upstream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
<marker id="arrow-backport" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a5b12"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6462"/></marker>
<marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
</defs>
<rect width="1180" height="540" rx="16" fill="#ffffff"/>
<text x="32" y="38" font-size="18.9" font-weight="600" fill="#18181b" text-anchor="start">The inner loop runs on your machine. Only a change that works leaves it.</text>
<text x="32" y="60" font-size="16.9" font-weight="400" fill="#5b6462" text-anchor="start">Purple: the contributor skill (.claude/skills) or agent role that guides each step.</text>
<rect x="30" y="140" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="30" y="140" width="250" height="6" rx="3" fill="#18181b"/>
<text x="48" y="174" font-size="18.9" font-weight="700" fill="#18181b" text-anchor="start">Edit</text>
<text x="48" y="200" font-size="14.9" font-weight="400" fill="#5b6462">on a feature branch,</text>
<text x="48" y="221" font-size="14.9" font-weight="400" fill="#5b6462">in its own worktree</text>
<text x="48" y="272" font-size="14.9" font-weight="600" fill="#6d28d9" textLength="214" lengthAdjust="spacingAndGlyphs">client-dev · daemon-dev roles</text>
<rect x="320" y="140" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="320" y="140" width="250" height="6" rx="3" fill="#18181b"/>
<text x="338" y="174" font-size="18.9" font-weight="700" fill="#18181b" text-anchor="start">Run</text>
<text x="338" y="200" font-size="14.9" font-weight="400" fill="#18181b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">npm run preview</text>
<text x="338" y="221" font-size="14.9" font-weight="400" fill="#18181b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">npm run dev:live</text>
<text x="338" y="272" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-live-dev</text>
<rect x="610" y="140" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="610" y="140" width="250" height="6" rx="3" fill="#18181b"/>
<text x="628" y="174" font-size="18.9" font-weight="700" fill="#18181b" text-anchor="start">Check</text>
<text x="628" y="200" font-size="14.9" font-weight="400" fill="#18181b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">npm run shot / probe</text>
<text x="628" y="221" font-size="14.9" font-weight="400" fill="#5b6462" textLength="214" lengthAdjust="spacingAndGlyphs">or use it in a browser or app</text>
<text x="628" y="272" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-web-debug</text>
<rect x="900" y="140" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="900" y="140" width="250" height="6" rx="3" fill="#1f8a55"/>
<text x="918" y="174" font-size="18.9" font-weight="700" fill="#1f8a55" text-anchor="start">Verify</text>
<text x="918" y="200" font-size="14.9" font-weight="400" fill="#18181b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">verify.mjs --changed</text>
<text x="918" y="221" font-size="14.9" font-weight="400" fill="#5b6462">format, lint, types, tests</text>
<text x="918" y="272" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-dev</text>
<rect x="900" y="364" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="900" y="364" width="250" height="6" rx="3" fill="#18181b"/>
<text x="918" y="398" font-size="18.9" font-weight="700" fill="#18181b" text-anchor="start">Docs and strings</text>
<text x="918" y="424" font-size="14.9" font-weight="400" fill="#5b6462">docs page and screenshots</text>
<text x="918" y="445" font-size="14.9" font-weight="400" fill="#5b6462">UI copy in nine locales</text>
<text x="918" y="477" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-docs</text>
<text x="918" y="496" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-i18n</text>
<rect x="610" y="364" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="610" y="364" width="250" height="6" rx="3" fill="#c77700"/>
<text x="628" y="398" font-size="18.9" font-weight="700" fill="#c77700" text-anchor="start">Land on main</text>
<text x="628" y="424" font-size="14.9" font-weight="400" fill="#5b6462">merge and push main</text>
<text x="628" y="445" font-size="14.9" font-weight="400" fill="#5b6462">CI runs the full suite</text>
<text x="628" y="496" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-build-monitor</text>
<rect x="320" y="364" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="320" y="364" width="250" height="6" rx="3" fill="#c77700"/>
<text x="338" y="398" font-size="18.9" font-weight="700" fill="#c77700" text-anchor="start">Beta</text>
<text x="338" y="424" font-size="14.9" font-weight="400" fill="#18181b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">X.Y.Z-beta.N</text>
<text x="338" y="445" font-size="14.9" font-weight="400" fill="#5b6462" textLength="214" lengthAdjust="spacingAndGlyphs">CI cuts it; test in frogg beta</text>
<text x="338" y="496" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-release</text>
<rect x="30" y="364" width="250" height="146" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<rect x="30" y="364" width="250" height="6" rx="3" fill="#1f8a55"/>
<text x="48" y="398" font-size="18.9" font-weight="700" fill="#1f8a55" text-anchor="start">Stable</text>
<text x="48" y="424" font-size="14.9" font-weight="400" fill="#18181b" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">release:promote</text>
<text x="48" y="445" font-size="14.9" font-weight="400" fill="#5b6462">explicit instruction only</text>
<text x="48" y="496" font-size="14.9" font-weight="600" fill="#6d28d9">frogg-release</text>
