<text x="100" y="205" font-size="15.5" font-weight="400" fill="#5b6462" text-anchor="middle">upstream beta</text>
<text x="100" y="223" font-size="15.5" font-weight="600" fill="#c77700" text-anchor="middle">beta app</text>
