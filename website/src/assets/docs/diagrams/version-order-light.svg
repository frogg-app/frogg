<rect x="40" y="272" width="1100" height="50" rx="10" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-opacity="0.5"/>
<text x="60" y="302" font-size="17.6" font-weight="700" fill="#c62828" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">✗  1.8.0-acme.1-beta.1</text>
<text x="315" y="302" font-size="16.9" font-weight="400" fill="#18181b" text-anchor="start">reads as a rebuild of 1.8.0 and sorts above it. Put the channel part first: 1.8.0-beta.1.acme.1</text>
