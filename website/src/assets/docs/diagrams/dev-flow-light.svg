<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="580" viewBox="0 0 1180 580" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow-stable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8a55"/></marker>
<marker id="arrow-beta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77700"/></marker>
<marker id="arrow-upstream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
<marker id="arrow-backport" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a5b12"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6462"/></marker>
<marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
</defs>
<rect width="1180" height="580" rx="16" fill="#ffffff"/>
<text x="32" y="40" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Test on the cheapest local rung first. Work lands on main; a green push ships a beta.</text>
<text x="32" y="62" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Stable moves only by an explicit promotion or backport. Nothing merges back from stable.</text>
<text x="32" y="146" font-size="20.3" font-weight="700" fill="#1f8a55" text-anchor="start">stable</text><text x="32" y="164" font-size="16.2" font-weight="400" fill="#5b6462" text-anchor="start">ships frogg</text>
<text x="32" y="286" font-size="20.3" font-weight="700" fill="#c77700" text-anchor="start">main</text><text x="32" y="304" font-size="16.2" font-weight="400" fill="#5b6462" text-anchor="start">ships frogg beta</text>
<line x1="200" y1="150" x2="1140" y2="150" stroke="#1f8a55" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
<line x1="200" y1="290" x2="1140" y2="290" stroke="#c77700" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
<rect x="220" y="362" width="690" height="108" rx="12" fill="#f6f7f7" fill-opacity="1" stroke="#dfe3e2"/>
<text x="240" y="394" font-size="16.2" font-weight="400" fill="#5b6462">feature branch in its own worktree: test locally, cheapest rung first</text>
<rect x="240" y="423" width="90.15" height="28" rx="14" fill="#f6f7f7" stroke="#5b6462"/><text x="252" y="442" font-size="15.5" font-weight="600" fill="#5b6462" textLength="66.15" lengthAdjust="spacingAndGlyphs">preview</text>
<rect x="342.15" y="423" width="99.60000000000001" height="28" rx="14" fill="#f6f7f7" stroke="#5b6462"/><text x="354.15" y="442" font-size="15.5" font-weight="600" fill="#5b6462" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs">dev:live</text>
<rect x="453.75" y="423" width="99.60000000000001" height="28" rx="14" fill="#f6f7f7" stroke="#5b6462"/><text x="465.75" y="442" font-size="15.5" font-weight="600" fill="#5b6462" textLength="75.60000000000001" lengthAdjust="spacingAndGlyphs">app host</text>
<rect x="565.35" y="423" width="127.95" height="28" rx="14" fill="#f6f7f7" stroke="#5b6462"/><text x="577.35" y="442" font-size="15.5" font-weight="600" fill="#5b6462" textLength="103.95" lengthAdjust="spacingAndGlyphs">dev:desktop</text>
<rect x="705.3" y="423" width="175.20000000000002" height="28" rx="14" fill="#f6f7f7" stroke="#1f8a55"/><text x="717.3" y="442" font-size="15.5" font-weight="600" fill="#1f8a55" textLength="151.20000000000002" lengthAdjust="spacingAndGlyphs">verify --changed</text>
<path d="M 230 290 C 230 330, 260 330, 260 358" fill="none" stroke="#5b6462" stroke-width="2" marker-end="url(#arrow-muted)"/>
<path d="M 890 360 C 890 322, 930 322, 930 302" fill="none" stroke="#5b6462" stroke-width="2" marker-end="url(#arrow-muted)"/>
<text x="880" y="340" font-size="16.2" font-weight="400" fill="#5b6462" text-anchor="end">land on main</text>
<circle cx="250" cy="150" r="8" fill="#1f8a55" stroke="#ffffff" stroke-width="2"/><text x="250" y="134" font-size="16.2" font-weight="400" fill="#18181b" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1.6.4</text>
<circle cx="520" cy="150" r="8" fill="#1f8a55" stroke="#ffffff" stroke-width="2"/><text x="520" y="134" font-size="16.2" font-weight="400" fill="#18181b" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1.6.5</text>
<circle cx="1080" cy="150" r="8" fill="#1f8a55" stroke="#ffffff" stroke-width="2"/><text x="1080" y="134" font-size="16.2" font-weight="400" fill="#18181b" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1.6.6</text>
<circle cx="380" cy="290" r="8" fill="#c77700" stroke="#ffffff" stroke-width="2"/><text x="380" y="316" font-size="16.2" font-weight="400" fill="#18181b" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1.6.6-beta.1</text>
<circle cx="1010" cy="290" r="8" fill="#c77700" stroke="#ffffff" stroke-width="2"/><text x="1010" y="316" font-size="16.2" font-weight="400" fill="#18181b" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">1.6.6-beta.2</text>
<text x="1010" y="338" font-size="15.5" font-weight="600" fill="#c77700" text-anchor="middle">test it in frogg beta</text>
<circle cx="460" cy="290" r="4" fill="#9a5b12"/>
<path d="M 460 290 C 460 220, 520 220, 520 160" fill="none" stroke="#9a5b12" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-backport)"/><text x="474" y="224" font-size="16.2" font-weight="600" fill="#9a5b12" text-anchor="end">backport</text>
<path d="M 1010 290 C 1010 220, 1080 220, 1080 160" fill="none" stroke="#1f8a55" stroke-width="2.5" marker-end="url(#arrow-stable)"/><text x="1030" y="224" font-size="16.2" font-weight="600" fill="#1f8a55" text-anchor="end">promote</text>
<text x="32" y="512" font-size="16.9" font-weight="400" fill="#5b6462" text-anchor="start">CI cuts the next X.Y.Z-beta.N and builds it after every green push to main.</text>
<rect x="32" y="535" width="250.8" height="28" rx="14" fill="#f6f7f7" stroke="#9a5b12"/><text x="44" y="554" font-size="15.5" font-weight="600" fill="#9a5b12" textLength="226.8" lengthAdjust="spacingAndGlyphs">npm run release:backport</text>
<rect x="294.8" y="535" width="222.45000000000002" height="28" rx="14" fill="#f6f7f7" stroke="#1f8a55"/><text x="306.8" y="554" font-size="15.5" font-weight="600" fill="#1f8a55" textLength="198.45000000000002" lengthAdjust="spacingAndGlyphs">npm run release:patch</text>
<rect x="529.25" y="535" width="241.35000000000002" height="28" rx="14" fill="#f6f7f7" stroke="#1f8a55"/><text x="541.25" y="554" font-size="15.5" font-weight="600" fill="#1f8a55" textLength="217.35000000000002" lengthAdjust="spacingAndGlyphs">npm run release:promote</text>
</svg>
