<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow-stable" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f8a55"/></marker>
<marker id="arrow-beta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c77700"/></marker>
<marker id="arrow-dev" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1d6fd1"/></marker>
<marker id="arrow-upstream" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6d28d9"/></marker>
<marker id="arrow-backport" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a5b12"/></marker>
<marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b6462"/></marker>
<marker id="arrow-danger" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
</defs>
<rect width="1120" height="400" rx="16" fill="#ffffff"/>
<text x="40" y="44" font-size="18.9" font-weight="600" fill="#18181b" text-anchor="start">One daemon identity; the client follows the version.</text>
<text x="40" y="66" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Prereleases test Frogg Next and the next daemon; stable keeps the classic app.</text>
<rect x="40" y="92" width="440" height="244" rx="14" fill="#f6f7f7" stroke="#1f8a55" stroke-width="1.5"/>
<rect x="40" y="92" width="440" height="44" rx="14" fill="#1f8a55" fill-opacity="0.16"/>
<text x="60" y="120" font-size="23" font-weight="700" fill="#1f8a55" text-anchor="start">Stable release  vX.Y.Z</text>
<text x="60" y="164" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Apps</text>
<text x="190" y="164" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">frogg desktop + APK</text>
<text x="60" y="194" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">App id</text>
<text x="190" y="194" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">app.frogg.frogg</text>
<text x="60" y="224" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Daemon</text>
<text x="190" y="224" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">frogg-daemon :9999</text>
<text x="60" y="254" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Data</text>
<text x="190" y="254" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">~/.frogg</text>
<text x="60" y="284" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Feeds</text>
<text x="190" y="284" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">electron-latest*.yml</text>
<text x="60" y="322" font-size="16.9" font-weight="600" fill="#1f8a55" text-anchor="start">The classic app updates to stable releases only</text>
<rect x="640" y="92" width="440" height="244" rx="14" fill="#f6f7f7" stroke="#c77700" stroke-width="1.5"/>
<rect x="640" y="92" width="440" height="44" rx="14" fill="#c77700" fill-opacity="0.16"/>
<text x="660" y="120" font-size="23" font-weight="700" fill="#c77700" text-anchor="start">Prerelease  vX.Y.Z-beta.N</text>
<text x="660" y="164" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Apps</text>
<text x="790" y="164" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">Frogg Next desktop + APK</text>
<text x="660" y="194" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">App id</text>
<text x="790" y="194" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">app.frogg.next</text>
<text x="660" y="224" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Daemon</text>
<text x="790" y="224" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">frogg-daemon :9999</text>
<text x="660" y="254" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Data</text>
<text x="790" y="254" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">~/.frogg</text>
<text x="660" y="284" font-size="17.6" font-weight="400" fill="#5b6462" text-anchor="start">Feeds</text>
<text x="790" y="284" font-size="17.6" font-weight="400" fill="#18181b" text-anchor="start" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">frogg-next-latest*.yml</text>
<text x="660" y="322" font-size="16.9" font-weight="600" fill="#c77700" text-anchor="start">Frogg Next updates to prereleases</text>
<path d="M 626 214 L 500 214" stroke="#5b6462" stroke-width="2" marker-end="url(#arrow-muted)"/>
<text x="563" y="200" font-size="16.2" font-weight="400" fill="#5b6462" text-anchor="middle">promote</text>
<text x="563" y="236" font-size="16.2" font-weight="400" fill="#5b6462" text-anchor="middle">a beta line</text>
<text x="40" y="372" font-size="16.9" font-weight="400" fill="#5b6462" text-anchor="start">A prerelease daemon is the normal daemon on a newer version: FROGG_CHANNEL=beta, or the Beta update channel.</text>
</svg>
